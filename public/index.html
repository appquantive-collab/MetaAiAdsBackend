<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta Ads AI</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; --accent:#0866ff; --card:#f7f8fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --fg:#eee; --muted:#9aa; --line:#333; --card:#1f2228; } }
  body { font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem } h2 { font-size:1.1rem; margin-top:1.5rem }
  label { display:block; margin:.6rem 0 .2rem; font-size:.9rem; color:var(--muted) }
  input, select { width:100%; padding:.5rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); box-sizing:border-box }
  button { margin:.6rem .4rem 0 0; padding:.55rem 1rem; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line) }
  button.danger { background:#c62828 }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.8rem; margin:.5rem 0 }
  .muted { color:var(--muted); font-size:.9rem }
  #err { color:#c62828 }
</style>
</head>
<body>
<h1>Meta Ads AI</h1>
<p class="muted" id="status"></p>
<p id="err"></p>

<section id="s0">
  <h2>Sign in</h2>
  <label>Business / agency name (sign up only)<input id="org"></label>
  <label>Email<input id="email" type="email"></label>
  <label>Password (8+ characters)<input id="pw" type="password"></label>
  <button onclick="auth('login')">Log in</button><button class="sec" onclick="auth('signup')">Sign up</button>
</section>

<section id="s1" hidden>
  <h2>1. Tell us about your business</h2>
  <label>Business name<input id="name" value="Sweet Crumbs"></label>
  <label>Type<input id="type" value="bakery"></label>
  <label>City<input id="city" value="Delhi"></label>
  <label>Offer<input id="offer" value="Fresh cakes from ₹499"></label>
  <label>Daily budget (₹)<input id="budget" type="number" value="500"></label>
  <label>WhatsApp number<input id="wa" value="+91 98765 43210"></label>
  <label>Facebook Page ID<input id="page" value="1234567890"></label>
  <label>Goal
    <select id="goal"><option value="whatsapp_messages">WhatsApp messages</option><option value="lead_forms">Lead forms</option></select>
  </label>
  <button onclick="saveBusiness()">Save and connect Facebook</button>
</section>

<section id="s1b" hidden>
  <h2>2. Connect your Meta ad account</h2>
  <p class="muted">You pay Meta directly for ad spend with the card on your own ad account. We never see your card.</p>
  <button id="fbBtn" onclick="connectFb()">Connect Facebook</button>
  <div id="assets" hidden>
    <label>Ad account<select id="acct"></select></label>
    <label>Facebook Page<select id="pg"></select></label>
    <button onclick="selectAssets()">Use these</button>
  </div>
  <button class="sec" id="goPropose" hidden onclick="propose()">Propose a campaign</button>
</section>

<section id="s2" hidden>
  <h2>3. Review the proposal</h2>
  <div id="plan"></div><div id="ads"></div>
  <label>Image URL<input id="img" value="https://example.com/cake.jpg"></label>
  <button onclick="approve()">Approve and launch</button>
</section>

<section id="s3" hidden>
  <h2>4. Live campaign</h2>
  <button onclick="optimize()">Run today's check</button>
  <button class="danger" onclick="kill()">Kill switch (pause all)</button>
  <div id="report"></div><div id="actions"></div>
</section>

<script>
let bid, cid, token = sessionStorage.getItem("token");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
async function api(url, method = "GET", body) {
  const r = await fetch(url, { method, headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) { $("err").textContent = j.error || "Error"; throw new Error(j.error); }
  $("err").textContent = ""; return j;
}
fetch("/api/health").then((r) => r.json()).then((h) =>
  $("status").textContent = `Meta: ${h.dryRun ? "dry run (nothing is sent to Meta)" : "live"} · Claude: ${h.claude ? "on" : "offline fallback"}`);

async function auth(kind) {
  const body = { email: $("email").value, password: $("pw").value, ...(kind === "signup" ? { orgName: $("org").value } : {}) };
  const r = await api("/api/auth/" + kind, "POST", body);
  token = r.token; sessionStorage.setItem("token", token); showApp();
}
function showApp() { $("s0").hidden = !!token; $("s1").hidden = !token; }
showApp();
// Back from Facebook: restore the business and show the account picker.
if (token && new URLSearchParams(location.search).get("meta") === "connected") {
  bid = sessionStorage.getItem("bid"); $("s1b").hidden = false; history.replaceState({}, "", "/"); loadAssets();
}
async function saveBusiness() {
  const b = await api("/api/businesses", "POST", {
    name: $("name").value, type: $("type").value, city: $("city").value, offer: $("offer").value,
    goal: $("goal").value, dailyBudgetInr: Number($("budget").value), whatsappNumber: $("wa").value,
    pageId: $("page").value, languages: ["en", "hinglish"],
  });
  bid = b.id; sessionStorage.setItem("bid", bid);
  $("s1b").hidden = false;
}
async function connectFb() {
  const r = await api(`/api/businesses/${bid}/meta/login-url`);
  location.href = r.url;
}
async function loadAssets() {
  const a = await api(`/api/businesses/${bid}/meta/assets`);
  $("acct").innerHTML = a.adAccounts.map((x) => `<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.currency)}${x.hasPaymentMethod ? "" : ", no card"})</option>`).join("");
  $("pg").innerHTML = a.pages.map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
  $("assets").hidden = false; $("fbBtn").hidden = true;
}
async function selectAssets() {
  await api(`/api/businesses/${bid}/meta/select`, "POST", { accountId: $("acct").value, pageId: $("pg").value });
  $("goPropose").hidden = false;
}
async function propose() {
  const p = await api(`/api/businesses/${bid}/propose`, "POST", {});
  cid = p.campaignId;
  $("plan").innerHTML = `<div class="card"><b>${esc(p.plan.objective)}</b> · ₹${p.plan.dailyBudgetInr}/day for ${p.plan.durationDays} days<br>
    ${esc(p.plan.targeting.geo.city)} +${p.plan.targeting.geo.radiusKm}km, ages ${p.plan.targeting.ageMin}-${p.plan.targeting.ageMax} (${esc(p.plan.targeting.mode)})<br>
    <span class="muted">${esc(p.plan.rationale)}</span></div>`;
  $("ads").innerHTML = p.variations.map((v) => `<div class="card"><b>${esc(v.headline)}</b> <span class="muted">${v.language} · ${v.cta}</span><br>${esc(v.primaryText)}</div>`).join("");
  $("s2").hidden = false;
}
async function approve() {
  await api(`/api/campaigns/${cid}/approve`, "POST", { imageUrl: $("img").value });
  $("s3").hidden = false;
}
async function optimize() {
  const r = await api(`/api/campaigns/${cid}/optimize`, "POST", {});
  $("report").innerHTML = `<div class="card">${esc(r.summary).replace(/\n/g, "<br>")}</div>`;
  const c = await api(`/api/campaigns/${cid}`);
  $("actions").innerHTML = c.actions.filter((a) => a.status === "pending").map((a) =>
    `<div class="card">${esc(a.reason)}<br><button onclick="act('${a.id}','approve')">Approve</button><button class="sec" onclick="act('${a.id}','reject')">Reject</button></div>`).join("");
}
async function act(id, verb) { await api(`/api/actions/${id}/${verb}`, "POST", {}); optimize(); }
async function kill() { await api(`/api/businesses/${bid}/kill`, "POST", { on: true }); $("report").innerHTML = '<div class="card">All campaigns paused.</div>'; }
</script>
</body>
</html>
